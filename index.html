<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Módulo 1 · Avícola La Lojana</title>
<style>
:root{--bg:#f3efe8;--card:#fff;--ink:#25302a;--g:#0f4a30;--g2:#2e6b4a;--o:#e8630a;--lo:#fdeedd;--lg:#dceadd;--lr:#f7ddd9;--r:#c0392b;--b:#e7f0fb;--line:#d9d0c4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0b2f1f;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--b:#1d3047;--line:#3b4a41}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0b2f1f;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--b:#1d3047;--line:#3b4a41}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:17px/1.45 "Trebuchet MS","Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--card);border-bottom:3px solid var(--o);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{width:34px}.brand{font-weight:700;color:var(--g2);line-height:1.1}.brand small{display:block;font-weight:400;color:var(--ink);opacity:.8}
.who{margin-left:auto;font-size:14px;text-align:right}.pg{flex:1 1 150px;min-width:140px;font-size:13px}.pg i{display:block;height:7px;border-radius:4px;background:var(--line);margin-top:3px}.pg i b{display:block;height:100%;border-radius:4px;background:var(--g2);width:0}
.wrap{display:grid;grid-template-columns:240px 1fr;gap:14px;max-width:1000px;margin:0 auto;padding:14px}
aside{background:var(--card);border-radius:14px;padding:10px;align-self:start}aside button.j{display:flex;gap:8px;width:100%;font:inherit;font-size:15px;text-align:left;color:inherit;background:none;border:0;border-radius:10px;padding:8px;min-height:40px;align-items:center}
aside button.j.on{background:var(--g);color:#fff}aside button.j:disabled{opacity:.5}.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--lg);color:var(--g);display:grid;place-items:center;font-size:13px;font-weight:700}.on .n{background:#fff}
.time{margin-top:10px;background:var(--lg);border-radius:12px;padding:10px;font-size:14px}.time b{display:block;font-size:20px;color:var(--g2)}
#tg{display:none;font:inherit;font-weight:700;background:var(--card);color:var(--g2);border:2px solid var(--g2);border-radius:20px;padding:8px 14px;margin:10px 14px 0;min-height:44px}
.hero{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.hero small{opacity:.85}.hero h1{margin:2px 0 6px;font-size:26px;line-height:1.15}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.tabs div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:13.5px;font-weight:700;opacity:.6}.tabs .on{opacity:1;background:var(--g);color:#fff}.tabs .ok{opacity:1;color:var(--g2)}
.pnl{background:var(--card);border-radius:16px;padding:16px}h2{margin:0 0 8px;font-size:21px;color:var(--g2)}
.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}.say img{width:54px;flex:none}.bub{background:var(--lo);border-radius:14px;padding:11px 13px;flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bx{border-radius:12px;padding:12px;margin:8px 0}.bx.b{background:var(--b)}.bx.o{background:var(--lo)}.bx h3{margin:0 0 4px;font-size:16px}.bx ul{margin:0;padding-left:20px}
details{border:2px solid var(--g2);border-radius:12px;padding:10px 12px;margin:10px 0}summary{font-weight:700;color:var(--g2);min-height:32px}
.pick{border-color:var(--o)!important;background:var(--lo)!important}.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:48px}.ok2{background:var(--lg)!important;border-color:var(--g2)!important}.bad{background:var(--lr)!important;border-color:var(--r)!important}
.why{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15.5px;background:var(--lg)}.why.bad{background:var(--lr)}
.row{border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.row p{margin:0 0 6px}.tg{display:flex;gap:8px}.tg button{flex:1;font:inherit;font-weight:700;border:2px solid;border-radius:22px;padding:9px;min-height:44px;background:var(--card);color:inherit}.tg .y{border-color:var(--g2)}.tg .n{border-color:var(--r)}.tg .s.y{background:var(--g2);color:#fff}.tg .s.n{background:var(--r);color:#fff}
.chip{display:inline-block;font:inherit;font-size:15px;background:var(--lo);border:2px solid var(--o);color:inherit;border-radius:20px;padding:7px 12px;margin:3px 5px 3px 0;min-height:42px}.chip.on{background:var(--o);color:#fff}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.go{display:block;margin:14px auto 0;font:inherit;font-weight:700;color:#fff;background:var(--g);border:0;border-radius:26px;padding:14px 28px;min-height:52px}.go:disabled{opacity:.4}.back{font:inherit;color:var(--g2);background:none;border:0;padding:10px;min-height:44px}
.sum{background:var(--lg);border-radius:14px;padding:14px;margin:10px 0}.big{font-size:34px;font-weight:700;color:var(--o);line-height:1}.small{font-size:14px;opacity:.85}
.share{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:26px;padding:13px;margin:8px 0;background:#1f9d55;color:#fff;border:0;width:100%}.share.alt{background:var(--card);color:var(--o);border:2px solid var(--o)}
textarea{width:100%;height:120px;font:14px monospace;border-radius:10px;padding:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
@media print{header,aside,#tg,.noprint{display:none!important}body{background:#fff}.wrap{display:block;padding:0}.pnl{box-shadow:none}}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--o);outline-offset:2px}
@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:10px}aside{display:none}aside.show{display:block}#tg{display:inline-block}.cols{grid-template-columns:1fr}.hero h1{font-size:23px}.tabs div{font-size:12px}}
</style></head><body>

const J1={"sub": "Una empresa con respeto y oportunidades para todos fortalece el trabajo en equipo.", "ess": "Todas las personas tenemos derecho a trabajar en condiciones de <b>igualdad</b>, con una remuneración justa, las <b>mismas oportunidades</b> y <b>respeto</b>.", "ex": "Esta capacitación es una <b>obligación legal</b> de la empresa, no una decisión interna. Aplica a toda empresa, sin importar cómo esté formado su equipo.<br><br><b>Otro ejemplo:</b> Una empresa de 6 trabajadores y una de 600 tienen la misma obligación de capacitar sobre igualdad y no discriminación. El tamaño cambia la forma de organizarlo, no la obligación.", "ideas": ["<b>Respeto:</b> tratamos a todos con dignidad.", "<b>Igualdad:</b> todos tenemos las mismas oportunidades.", "<b>Inclusión:</b> valoramos las diferencias.", "<b>Entorno seguro:</b> sin acoso ni violencia."], "deep": "<p><b>Constitución, Art. 11:</b> todas las personas son iguales y gozan de los mismos derechos, sin discriminación por sexo, edad, etnia, discapacidad ni ninguna otra condición.</p><p><b>Art. 33:</b> el trabajo es un derecho y un deber social, con remuneraciones justas para todos.</p><p><b>Art. 66:</b> derecho a una vida libre de violencia.</p><p><b>Art. 70:</b> el Estado formula políticas para la igualdad entre mujeres y hombres.</p><p>El Acuerdo Ministerial MDT-2025-006 exige un mínimo de <b>40 horas anuales</b> de capacitación, dirigidas a todos los trabajadores.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Pedro lleva 12 años en el galpón y Ana llegó hace un mes. En la capacitación, un compañero dice: «eso es solo para los nuevos». El supervisor responde que la ley pide capacitar a <b>todos los trabajadores</b>, incluidos los antiguos.</p><p><b>Para pensar:</b> ¿Por qué es importante que todos participen, aunque lleven muchos años?</p></div><p>Las normas funcionan cuando las <b>conoce todo el equipo</b>: quienes dirigen, quienes llevan años y quienes recién empiezan.</p>", "acts": [{"q": "La igualdad y la no discriminación solo tratan de diferencias entre hombres y mujeres.", "g": "¿Recuerdas si la lectura habla solo de hombres y mujeres o también menciona otras condiciones de las personas? Fíjate en la palabra «solo».", "o": ["Verdadero", "Falso"], "c": 1, "e": "Incluyen también la edad, el origen, la discapacidad y muchas otras condiciones."}, {"q": "La ley aplica solo a las empresas grandes.", "g": "Piensa en la frase «toda empresa»: ¿importa el tamaño o cómo esté formado el equipo?", "o": ["Verdadero", "Falso"], "c": 1, "e": "La ley aplica a toda empresa, sin importar su tamaño ni cómo esté formado su equipo."}, {"q": "Esta capacitación es una obligación legal.", "g": "¿Quién la pide: la empresa solo por gusto, o la normativa ecuatoriana?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Forma parte de las obligaciones de la normativa ecuatoriana; no es una decisión interna."}, {"q": "¿Qué significa «entorno seguro»?", "g": "Mira el recuadro de valores. Busca las palabras «acoso» y «violencia».", "o": ["Un lugar de trabajo libre de acoso y violencia", "Un lugar con pocas herramientas", "Un lugar donde nadie habla"], "c": 0, "e": "Entorno seguro es un lugar de trabajo libre de acoso y violencia."}, {"q": "¿Qué dice el Artículo 11 de la Constitución?", "g": "La palabra clave es «todas»: habla de todas las personas.", "o": ["Todas las personas son iguales y gozan de los mismos derechos", "Solo algunas personas tienen derechos", "El trabajo es un favor"], "c": 0, "e": "El Art. 11 dice que todas las personas son iguales y tienen los mismos derechos."}, {"q": "Según el Artículo 33, el trabajo es…", "g": "Dos palabras aparecen juntas: derecho y deber. Revisa «Profundizar».", "o": ["Un favor del empleador", "Un derecho y un deber social, con remuneraciones justas", "Solo un deber"], "c": 1, "e": "El trabajo es un derecho y un deber social, con remuneraciones justas para todos."}, {"q": "El Artículo 66 reconoce el derecho a…", "g": "Piensa en el valor «entorno seguro»: ¿qué derecho lo protege?", "o": ["Una vida libre de violencia", "Un sueldo igual para todos", "Trabajar sin horario"], "c": 0, "e": "El Art. 66 reconoce el derecho a una vida libre de violencia."}, {"q": "El Acuerdo Ministerial MDT-2025-006 exige un mínimo de 40 horas anuales de capacitación.", "g": "El número está en «Profundizar». ¿Recuerdas cuántas horas son?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Exige un mínimo de 40 horas anuales, dirigidas a todos los trabajadores."}, {"q": "¿Quiénes deben recibir esta capacitación?", "g": "Piensa en la palabra «todos»: el Acuerdo la dirige a…", "o": ["Solo los jefes", "Todos los trabajadores", "Solo los nuevos"], "c": 1, "e": "Está dirigida a todos los trabajadores."}, {"q": "Un equipo donde todos se respetan y tienen las mismas oportunidades trabaja mejor.", "g": "Piensa en tu galpón: ¿se trabaja mejor con respeto o con burlas?", "o": ["Verdadero", "Falso"], "c": 0, "e": "El respeto y la igualdad fortalecen el equipo y ayudan a que el trabajo salga bien."}, {"q": "Las personas con muchos años en la empresa no necesitan esta capacitación.", "g": "Piensa en «todos los trabajadores».", "o": ["Verdadero", "Falso"], "c": 1, "e": "La capacitación es para todos, sin importar la antigüedad."}, {"q": "¿Por qué la empresa da esta capacitación?", "g": "Recuerda quién la exige.", "o": ["Porque está de moda", "Porque es una obligación legal", "Porque sobra tiempo"], "c": 1, "e": "Es parte de las obligaciones de la normativa ecuatoriana."}, {"q": "La Constitución reconoce el trabajo como un derecho y un deber social.", "g": "Artículo 33.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí, el trabajo es un derecho y un deber social con remuneración justa."}, {"q": "Pedro dice «eso es para los nuevos». ¿Qué le responderías?", "g": "Mira el caso de la lectura.", "o": ["Que tiene razón", "Que no importa", "Que es para todos los trabajadores"], "c": 2, "e": "La capacitación incluye a todo el equipo."}, {"q": "¿Qué derecho protege el Artículo 66 mencionado en esta jornada?", "g": "Piensa en el ambiente de trabajo seguro.", "o": ["Una vida libre de violencia", "El derecho a vacaciones largas", "El derecho a escoger el turno"], "c": 0, "e": "Una vida libre de violencia incluye el trabajo."}], "vfold": [["La igualdad y la no discriminación solo tratan de diferencias entre hombres y mujeres.", 0, "Incluyen también la edad, el origen, la discapacidad y muchas otras condiciones. Fíjate en la palabra «solo»: es una pista de que la frase deja cosas fuera."], ["La ley aplica solo a las empresas grandes.", 0, "La ley aplica a toda empresa, sin importar su tamaño ni cómo esté formado su equipo."], ["Esta capacitación es una obligación legal.", 1, "Es parte de las obligaciones de la normativa ecuatoriana; no es una decisión interna de la empresa."]], "rf": ["¿qué significa para ti trabajar con respeto?", "Trabajar con respeto es tratar a todos con dignidad.", "Trabajar con respeto es"], "chips": ["escuchar a los demás", "no hacer burlas", "cuidar a mis compañeros"], "qz": [["¿Qué incluye la igualdad y la no discriminación?", ["Solo el género", "Edad, origen, discapacidad y muchas otras condiciones", "Solo la edad"], 1], ["¿Qué dice el Artículo 11 de la Constitución?", ["Todas las personas son iguales y gozan de los mismos derechos", "El trabajo es solo para mayores", "Solo algunos tienen derechos"], 0], ["¿Qué derecho reconoce el Artículo 66?", ["Un sueldo igual para todos", "Una vida libre de violencia", "Trabajar sin horario"], 1], ["Esta capacitación es…", ["Una obligación legal", "Un favor de la empresa", "Solo para los jefes"], 0], ["¿Cuántas horas anuales mínimas exige el Acuerdo MDT-2025-006?", ["10 horas", "40 horas", "100 horas"], 1]], "learn": ["Todos merecemos respeto en el trabajo.", "La ley de igualdad aplica a toda empresa.", "Esta capacitación es obligatoria."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J2={"sub": "Igualdad es oportunidades y trato justo para todos.", "ess": "<b>Igualdad</b> es que todas las personas tengan <b>las mismas oportunidades</b> y reciban un <b>trato justo</b>, sin discriminación. <b>No</b> quiere decir que todos hagan el mismo trabajo ni que a todos les paguen igual.", "ex": "Dos galponeros con el mismo puesto y las mismas tareas reciben el mismo trato, el mismo EPP y las mismas oportunidades.<br><br><b>Otro ejemplo:</b> Dos clasificadoras de huevos con la misma experiencia y las mismas tareas reciben la misma capacitación y los mismos implementos. Si una gana más, debe existir una razón del trabajo, como el turno nocturno o una responsabilidad extra.", "ideas": ["<b>Mismas oportunidades</b> para todos.", "<b>Mismo trato</b> ante situaciones iguales.", "<b>Criterios objetivos</b> para decidir.", "<b>Respeto</b> sin importar la condición personal."], "deep": "<p>La igualdad <b>no es</b> que todos seamos idénticos, ni ignorar las diferencias reales de experiencia o responsabilidad, ni un favor: es un derecho.</p><p>Las decisiones pueden tomar en cuenta las tareas, las responsabilidades, la experiencia y los requisitos del puesto.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Luis y Marcos son galponeros con el mismo puesto. A Luis siempre le avisan primero de las capacitaciones y a Marcos casi nunca. Nadie se lo explica.</p><p><b>Para pensar:</b> ¿Es igualdad? ¿Qué debería hacer la empresa?</p></div><p>Igualdad no es dar a todos lo mismo, sino asegurar que <b>nadie quede fuera</b> sin una razón del trabajo.</p>", "acts": [{"q": "Igualdad es que todas las personas tengan las mismas oportunidades.", "g": "Piensa en la primera idea clave de esta jornada.", "o": ["Verdadero", "Falso"], "c": 0, "e": "La igualdad se trata de oportunidades y trato justo."}, {"q": "Igualdad significa que todos deben hacer exactamente el mismo trabajo.", "g": "Mira la palabra «exactamente»: ¿la lectura dice eso?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: cada puesto puede tener tareas distintas."}, {"q": "Igualdad significa que todos deben ganar lo mismo sin importar sus responsabilidades.", "g": "¿El pago puede depender de las tareas y la responsabilidad?", "o": ["Verdadero", "Falso"], "c": 1, "e": "Las diferencias se explican por razones del trabajo."}, {"q": "Dos galponeros con el mismo puesto y las mismas tareas deben recibir…", "g": "Mismo puesto y mismas tareas: ¿mismo trato o trato distinto?", "o": ["Menos ayuda el que es nuevo", "El mismo EPP y las mismas oportunidades", "Más ayuda el más joven"], "c": 1, "e": "Con el mismo puesto y las mismas tareas, el trato es el mismo."}, {"q": "¿Cuál es una decisión basada en criterios objetivos?", "g": "Un criterio objetivo tiene que ver con el trabajo.", "o": ["Escoger al amigo", "Escoger por la apariencia", "Escoger por la experiencia relacionada con la tarea"], "c": 2, "e": "La experiencia relacionada con la tarea es un criterio objetivo."}, {"q": "Ignorar las diferencias reales de experiencia es igualdad.", "g": "¿Tratar igual lo que es distinto siempre es justo?", "o": ["Verdadero", "Falso"], "c": 1, "e": "La igualdad no ignora diferencias reales de experiencia o responsabilidad."}, {"q": "La igualdad es un favor que se otorga a algunos.", "g": "Recuerda: es un derecho, no un favor.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Es un derecho de todas las personas."}, {"q": "¿Qué incluye el trato justo?", "g": "Piensa en la idea clave «Respeto».", "o": ["Burlas ocasionales", "Respeto sin importar la condición personal", "Preferencias por amistad"], "c": 1, "e": "Incluye respeto sin importar la condición personal."}, {"q": "Mismo trato ante situaciones iguales es parte de la igualdad.", "g": "Si dos situaciones son iguales, ¿el trato debe ser igual?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: situaciones iguales, trato igual."}, {"q": "Para dar una capacitación de forma justa se debe revisar…", "g": "Piensa en qué tiene que ver con el trabajo.", "o": ["Quién la necesita para su tarea", "Quién es amigo de quien decide", "Quién llega primero siempre"], "c": 0, "e": "Se revisa quién la necesita para su tarea."}, {"q": "Si dos personas tienen el mismo puesto, la empresa puede darle más oportunidades a su favorito.", "g": "Piensa en «mismo trato ante situaciones iguales».", "o": ["Verdadero", "Falso"], "c": 1, "e": "Con situaciones iguales, el trato debe ser igual."}, {"q": "En el caso de Luis y Marcos, lo correcto es…", "g": "Mira la pregunta para pensar.", "o": ["Avisar a ambos al mismo tiempo", "Avisar solo a Luis", "No avisar a nadie"], "c": 0, "e": "Las oportunidades deben llegar a todos por igual."}, {"q": "Una diferencia de pago puede justificarse si…", "g": "Debe tener que ver con el trabajo.", "o": ["Es amigo del jefe", "Es más joven", "Hay una razón del trabajo, como una responsabilidad extra"], "c": 2, "e": "Las razones deben ser objetivas y del trabajo."}, {"q": "Igualdad quiere decir que nadie debe quedar fuera sin una razón del trabajo.", "g": "Revisa la lectura.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Ese es el sentido de la igualdad de oportunidades."}, {"q": "¿Quién debe recibir el mismo EPP si hace la misma tarea?", "g": "Piensa en seguridad para todos.", "o": ["Solo los antiguos", "Todos los que hacen esa tarea", "Solo los que pregunten"], "c": 1, "e": "La seguridad es para todos por igual."}], "chips": ["nos pagan puntual", "nos tratan con respeto", "tenemos las mismas oportunidades"], "rf": ["escribe un ejemplo de trato justo en el trabajo", "Un trato justo es cuando a todos nos dan el mismo EPP.", "Un trato justo es cuando"], "qz": [["¿Qué es igualdad en el trabajo?", ["Que todos hagan lo mismo", "Mismas oportunidades y trato justo", "Que todos ganen igual"], 1], ["Dos galponeros con el mismo puesto deben recibir…", ["Trato distinto por su edad", "Menos apoyo si son nuevos", "El mismo EPP y las mismas oportunidades"], 2], ["¿Qué NO es igualdad?", ["Respeto para todos", "Un favor que se otorga a algunos", "Criterios objetivos"], 1], ["Una decisión objetiva se apoya en…", ["La amistad", "La apariencia", "Información relacionada con la tarea"], 2], ["La igualdad es…", ["Un derecho", "Un favor", "Una opción de la empresa"], 0]], "learn": ["La igualdad es oportunidades y trato justo.", "Igualdad no es que todos hagan lo mismo.", "Todos merecemos el mismo respeto."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J3={"sub": "Dos compañeros pueden tener tareas, responsabilidades o experiencia distintas.", "ess": "Es válido tomar en cuenta diferencias de <b>tareas, responsabilidades o experiencia</b> cuando la razón tiene que ver con el trabajo. Lo que <b>no</b> es válido es decidir por <b>prejuicios</b>.", "ex": "Alguien con 10 años de experiencia manejando maquinaria puede tener más responsabilidad que alguien que recién entra. Es una diferencia real, no discriminación.<br><br><b>Otro ejemplo:</b> En un galpón trabajan personas de 19 y de 58 años, de distintas provincias y con distintas costumbres. Cada una aporta algo: energía, experiencia, otra forma de ver las cosas. La empresa necesita a todas.", "ideas": ["<b>Diferencia real:</b> tiene relación con el puesto.", "<b>Criterio objetivo:</b> experiencia, capacitación, funciones.", "<b>Prejuicio:</b> juzgar sin razón del trabajo.", "<b>Igualdad:</b> trato justo con diferencias reales."], "deep": "<p>Un <b>criterio objetivo</b> es una razón relacionada con el puesto, como la experiencia o la capacitación. Una característica personal sin relación con el trabajo no debe decidir por sí sola.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>A Carmen, de 55 años, le dicen «ya estás mayor para aprender el sistema nuevo». Ella tiene 20 años de experiencia clasificando.</p><p><b>Para pensar:</b> ¿La edad decide si alguien puede aprender? ¿Qué podría hacer el equipo?</p></div><p>Las diferencias de <b>edad, sexo, origen, cultura, discapacidad o creencias</b> no son un problema: son parte de la realidad de cualquier equipo.</p>", "acts": [{"q": "Dos compañeros pueden tener tareas y responsabilidades distintas.", "g": "Piensa en el ejemplo del galpón.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí, los puestos pueden tener tareas distintas."}, {"q": "Es válido considerar la experiencia cuando tiene relación con el trabajo.", "g": "¿La experiencia sirve para hacer la tarea?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: es una razón relacionada con el trabajo."}, {"q": "Decidir por prejuicios es válido.", "g": "Recuerda cómo termina la idea principal.", "o": ["Verdadero", "Falso"], "c": 1, "e": "No es válido decidir por prejuicios."}, {"q": "Don Carlos tiene 10 años en maquinaria y Juan entró hace una semana. Que Carlos tenga más responsabilidad es…", "g": "Piensa en la experiencia.", "o": ["Discriminación contra Juan", "Una diferencia real por experiencia", "Un favor"], "c": 1, "e": "Es una diferencia real, no discriminación."}, {"q": "Un criterio objetivo es una razón relacionada con el puesto.", "g": "Mira la definición en «Profundizar».", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: tiene relación con el puesto."}, {"q": "¿Cuál es un criterio objetivo?", "g": "¿Cuál tiene que ver con el trabajo?", "o": ["«Se ve flojo»", "«Es de otro lugar»", "Capacitación aprobada"], "c": 2, "e": "La capacitación aprobada se relaciona con la tarea."}, {"q": "«Es de otro lugar» es un criterio objetivo para negar una tarea.", "g": "¿Tiene relación con el trabajo?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: es un prejuicio sin relación con el trabajo."}, {"q": "Igualdad significa…", "g": "Piensa en trato justo y diferencias reales.", "o": ["Hacer siempre lo mismo", "Trato justo y oportunidades, considerando diferencias reales", "Ignorar la experiencia"], "c": 1, "e": "Trato justo y oportunidades, sin ignorar diferencias reales."}, {"q": "Pagar distinto puede explicarse por las responsabilidades del puesto.", "g": "¿El pago puede depender de la responsabilidad?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí, si la razón tiene relación con el trabajo."}, {"q": "Si una diferencia no tiene relación con el trabajo, es…", "g": "Piensa en la palabra «prejuicio».", "o": ["Un criterio válido", "Una regla", "Un posible prejuicio"], "c": 2, "e": "Es un posible prejuicio."}, {"q": "Las diferencias entre las personas debilitan a un equipo.", "g": "Piensa en lo que aporta cada persona.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Las diferencias pueden fortalecer el equipo si hay respeto."}, {"q": "Si a Carmen le dicen «ya estás mayor», lo correcto es…", "g": "La edad no decide la capacidad.", "o": ["Capacitarla igual que a los demás", "Excluirla", "Reírse"], "c": 0, "e": "Todos pueden aprender con el apoyo adecuado."}, {"q": "Una persona con discapacidad puede trabajar si se hacen los ajustes necesarios.", "g": "Piensa en ajustes razonables.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Con ajustes adecuados puede desarrollar su trabajo."}, {"q": "¿Qué es la diversidad en el trabajo?", "g": "Piensa en personas distintas.", "o": ["Que todos son iguales", "Que hay muchos jefes", "Que en el equipo hay personas diferentes entre sí"], "c": 2, "e": "La diversidad es la variedad de personas."}, {"q": "Un compañero de otra provincia habla con otro acento. ¿Qué haces?", "g": "Respeto ante todo.", "o": ["Me burlo del acento", "Lo trato igual que a los demás", "Lo evito"], "c": 1, "e": "Las diferencias merecen respeto."}], "chips": ["la experiencia", "la capacitación", "las funciones del puesto"], "rf": ["menciona un ejemplo de diferencia real entre dos puestos", "Una diferencia real es los años de experiencia.", "Una diferencia real es"], "qz": [["¿Qué puede considerarse para dar más responsabilidad?", ["La amistad", "El lugar de origen", "La experiencia relacionada con el puesto"], 2], ["Una diferencia real entre dos trabajadores es…", ["Su apariencia", "Años de experiencia manejando maquinaria", "Su forma de hablar"], 1], ["Decidir por prejuicios es…", ["Válido si es el jefe", "Válido si todos opinan igual", "No válido"], 2], ["Un criterio objetivo tiene que ver con…", ["La simpatía", "El origen", "El puesto y el trabajo"], 2], ["¿Dar más responsabilidad por más experiencia es discriminación?", ["Sí, siempre", "No, es una diferencia real", "Solo si el otro se molesta"], 1]], "learn": ["Puede haber diferencias reales de experiencia.", "Decidir por prejuicios no es justo.", "Un criterio objetivo tiene que ver con el puesto."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J4={"sub": "Discriminar es tratar peor a alguien sin una razón del trabajo.", "ess": "Hay <b>discriminación</b> cuando a una persona la tratan <b>peor</b> por una característica personal (edad, origen, apariencia…) y <b>sin una razón</b> relacionada con el trabajo.", "ex": "🐔 No contratar a alguien solo por tener más edad, aunque tenga experiencia y cumpla los requisitos para ser galponero.<br><br><b>Otro ejemplo:</b> Se necesita un operario para el turno de la mañana. Se descarta a una persona solo por su origen o por su edad, sin revisar si puede hacer el trabajo. Eso es discriminación.", "ideas": ["<b>Trato peor</b> que a otros.", "<b>Característica personal:</b> edad, origen, apariencia.", "<b>Sin razón</b> del trabajo.", "Puede pasar en contratación, pagos, ascensos y trato diario."], "deep": "<p>La discriminación puede aparecer en: contratación, salarios, ascensos, capacitación, asignación de oportunidades, trato cotidiano y condiciones laborales.</p><p>Ejemplos: pagar menos a un trabajador nuevo por las mismas tareas sin razón objetiva; excluirlo de una capacitación sin preguntarle; usar burlas o apodos ofensivos.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Ana postula a un puesto en bodega. Le dicen: «ese trabajo es solo para hombres». Ana tiene experiencia y cumple los requisitos.</p><p><b>Para pensar:</b> ¿El motivo tiene que ver con el trabajo? ¿Qué debería hacer la empresa?</p></div><p>Se discrimina cuando se trata <b>peor o se excluye</b> a alguien por una condición personal que <b>no tiene que ver con el trabajo</b>.</p>", "acts": [{"q": "Discriminar es tratar peor a una persona sin una razón del trabajo.", "g": "Piensa en la idea principal de esta jornada.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: es un trato peor sin razón relacionada con el trabajo."}, {"q": "Descartar a alguien solo por su edad, aunque cumpla los requisitos, puede ser discriminación.", "g": "¿Cumple los requisitos? Entonces, ¿qué razón queda?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: la edad sola no es una razón del trabajo."}, {"q": "¿Cuál situación podría ser discriminación?", "g": "Busca la que no revisa las capacidades.", "o": ["Excluir a alguien por su origen sin revisar sus capacidades", "Elegir por experiencia", "Asignar una tarea a quien tiene la capacitación"], "c": 0, "e": "Excluir por el origen, sin revisar capacidades, puede ser discriminación."}, {"q": "Pagar menos a un trabajador nuevo por las mismas tareas, sin razón objetiva, es justo.", "g": "Mismas tareas y sin razón objetiva: ¿mismo pago o distinto?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No es justo: mismas tareas, trato igual."}, {"q": "La discriminación puede aparecer en…", "g": "Revisa la lista de «Profundizar».", "o": ["Solo en los pagos", "Solo en la contratación", "Contratación, salarios, ascensos y trato diario"], "c": 2, "e": "Puede aparecer en muchos momentos del trabajo."}, {"q": "Excluir a alguien de una capacitación sin preguntarle es un trato justo.", "g": "¿Se le dio la oportunidad de decidir?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: es una forma de discriminar."}, {"q": "Una característica personal es…", "g": "Piensa en la persona, no en el puesto.", "o": ["La edad, el origen o la apariencia", "El puesto", "La experiencia en la tarea"], "c": 0, "e": "Edad, origen o apariencia son características personales."}, {"q": "Las burlas por la forma de hablar pueden ser discriminación.", "g": "¿Tienen relación con el trabajo?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: son un trato peor por una característica personal."}, {"q": "Para analizar una posible discriminación, ¿qué se revisa primero?", "g": "Piensa en la palabra «razón».", "o": ["Quién es más simpático", "Quién llegó primero", "Si hay una razón relacionada con el trabajo"], "c": 2, "e": "Primero se revisa si hay una razón relacionada con el trabajo."}, {"q": "Si hay una razón objetiva relacionada con el puesto, el trato distinto puede no ser discriminación.", "g": "Recuerda los criterios objetivos de la jornada 3.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: una razón objetiva del puesto puede justificar la diferencia."}, {"q": "Descartar a alguien por su edad, sin revisar su capacidad, es discriminación.", "g": "El motivo debe tener que ver con el trabajo.", "o": ["Verdadero", "Falso"], "c": 0, "e": "La edad, por sí sola, no define la capacidad."}, {"q": "En el caso de Ana, la empresa debería…", "g": "Revisar si cumple los requisitos.", "o": ["Rechazarla por ser mujer", "Evaluarla por su experiencia y requisitos", "Ignorarla"], "c": 1, "e": "Se decide por lo que pide el puesto."}, {"q": "¿Cuál es una razón válida para elegir a un candidato?", "g": "Piensa en el trabajo.", "o": ["Su experiencia y los requisitos del puesto", "Su apellido", "Su aspecto físico"], "c": 0, "e": "Los requisitos del puesto son una razón válida."}, {"q": "La discriminación solo ocurre cuando alguien grita o insulta.", "g": "Hay formas silenciosas.", "o": ["Verdadero", "Falso"], "c": 1, "e": "También ocurre al excluir u ofrecer menos oportunidades sin razón."}, {"q": "Si me excluyen por mi origen, lo primero que hago es…", "g": "Recuerda «cómo actuar».", "o": ["Callar", "Responder con insultos", "Mantener la calma, anotar y avisar"], "c": 2, "e": "Calma, registro y aviso."}], "chips": ["los requisitos del puesto", "la experiencia", "si hubo trato distinto sin razón"], "rf": ["¿qué información revisarías para analizar una posible discriminación?", "Revisaría si la razón tiene que ver con el trabajo.", "Revisaría"], "qz": [["¿Qué es discriminar?", ["Dar capacitación", "Tratar peor sin razón del trabajo", "Tratar igual a todos"], 1], ["Excluir a alguien solo por su origen es…", ["Posible discriminación", "Una regla", "Un criterio objetivo"], 0], ["La discriminación puede ocurrir en…", ["Contratación, pagos y trato diario", "Solo en reuniones", "Nunca"], 0], ["¿Cuál es una razón válida para un trato distinto?", ["La apariencia", "La edad", "La experiencia relacionada con la tarea"], 2], ["Descartar a alguien solo por su edad, aunque cumpla los requisitos, es…", ["Posible discriminación", "Obligatorio", "Justo"], 0]], "learn": ["Discriminar es tratar peor sin razón del trabajo.", "La edad o el origen no son motivo para excluir.", "Hay que revisar si la razón es del trabajo."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J5={"sub": "El respeto se nota al hablar, corregir y convivir.", "ess": "El respeto se nota en <b>cómo hablamos, cómo corregimos y cómo convivimos</b>. Las burlas, los apodos ofensivos y los comentarios sobre el origen, la edad, la apariencia o la forma de hablar <b>afectan la dignidad</b>. Que otros se rían <b>no</b> significa que esté bien.", "ex": "🐔 Un compañero recibe apodos por su forma de hablar y todos se ríen. No es una broma: afecta su dignidad.<br><br><b>Otro ejemplo:</b> En el comedor del galpón, un compañero nuevo se sienta solo. Un trabajador antiguo lo invita a la mesa y le presenta al grupo. Un gesto pequeño ayuda a que se sienta parte del equipo.", "ideas": ["<b>Hablar</b> con respeto.", "<b>Corregir</b> explicando qué cambiar.", "<b>Convivir</b> sin burlas ni apodos.", "Que otros se rían <b>no</b> lo hace correcto."], "deep": "<p>El respeto no impide corregir errores; exige hacerlo de manera adecuada. Por ejemplo: «Mira, se hace así. Inténtalo otra vez, tú puedes.»</p><p>Ningún compañero debe recibir gritos, humillaciones o maltrato dentro del galpón, ni de otro trabajador ni de un superior.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Rosa pide a un compañero que le alcance una herramienta. Él le responde: «¡Pide por favor y no grites!». Ella no gritó, pero había hablado rápido por el apuro.</p><p><b>Para pensar:</b> ¿Cómo se pueden pedir las cosas para evitar malos entendidos?</p></div><p>El respeto se muestra con el <b>tono de voz, las palabras y los gestos</b>. Pedir con amabilidad y agradecer mejora el trabajo de todos.</p>", "acts": [{"q": "Las burlas pueden afectar la dignidad de una persona.", "g": "Piensa en cómo se siente quien las recibe.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: afectan la dignidad."}, {"q": "Si todos se ríen de un apodo, entonces está bien.", "g": "¿Que otros se rían cambia lo que siente esa persona?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: que otros se rían no lo hace correcto."}, {"q": "¿Cuál es una frase respetuosa para corregir un error?", "g": "Busca la que explica qué cambiar.", "o": ["«Mira, se hace así. Inténtalo otra vez»", "«Nunca aprendes»", "«Qué torpe eres»"], "c": 0, "e": "Corregir con respeto explica qué cambiar."}, {"q": "Respetar impide corregir errores.", "g": "Recuerda: el respeto exige corregir de manera adecuada.", "o": ["Verdadero", "Falso"], "c": 1, "e": "No impide corregir: exige hacerlo bien."}, {"q": "Los apodos ofensivos sobre la forma de hablar…", "g": "Piensa en la palabra «dignidad».", "o": ["Ayudan al trabajo", "Son una broma", "Afectan la dignidad"], "c": 2, "e": "Afectan la dignidad de la persona."}, {"q": "Ningún compañero debe recibir gritos o humillaciones, ni de un superior.", "g": "¿Un superior puede maltratar?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Correcto: nadie debe recibir maltrato."}, {"q": "Para convivir con respeto debemos…", "g": "Piensa en lo que ayuda al equipo.", "o": ["Escuchar sin burlarnos", "Poner apodos", "Ignorar a los nuevos"], "c": 0, "e": "Escuchar sin burlarnos ayuda a convivir."}, {"q": "El respeto debe mantenerse aunque haya diferencias de opinión.", "g": "¿Pensar distinto da permiso de faltar al respeto?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: el respeto se mantiene siempre."}, {"q": "Si un compañero comete un error, lo mejor es…", "g": "Piensa en una corrección que enseñe.", "o": ["Explicarle qué cambiar", "Reírse con los demás", "Gritarle delante de todos"], "c": 0, "e": "Explicar qué cambiar ayuda a que aprenda."}, {"q": "Comentar sobre el origen o la apariencia de alguien es un trato respetuoso.", "g": "Recuerda la lista de lo que afecta la dignidad.", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: esos comentarios afectan la dignidad."}, {"q": "¿Qué gesto ayuda a que un compañero nuevo se sienta parte del equipo?", "g": "Piensa en integrar.", "o": ["Invitarlo y presentarlo al grupo", "Ignorarlo", "Burlarse de su forma de hablar"], "c": 0, "e": "Integrar es parte del buen trato."}, {"q": "El tono de voz también comunica respeto o falta de respeto.", "g": "Piensa en cómo suena lo que decimos.", "o": ["Verdadero", "Falso"], "c": 0, "e": "El tono importa tanto como las palabras."}, {"q": "Cuando alguien me ayuda, lo mejor es…", "g": "Un buen hábito.", "o": ["No decir nada", "Agradecerle", "Criticarlo"], "c": 1, "e": "Agradecer mejora el ambiente."}, {"q": "Si estoy apurado, puedo hablar con falta de respeto.", "g": "El respeto es siempre.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Aun con apuro, se puede pedir con amabilidad."}, {"q": "Si me molesta algo de un compañero, lo mejor es…", "g": "Piensa en diálogo.", "o": ["Hablar mal de él con otros", "Ignorarlo para siempre", "Decírselo con calma y respeto"], "c": 2, "e": "Dialogar con calma resuelve más."}], "chips": ["«Gracias por avisar.»", "«Vamos a verlo juntos.»", "«Te explico cómo se hace.»"], "rf": ["escribe tu propia frase respetuosa para corregir un error", "Yo diría: «Te explico cómo se hace y lo repetimos juntos.»", "Yo diría:"], "qz": [["El respeto se nota en…", ["Solo con los jefes", "Cómo hablamos, corregimos y convivimos", "Solo en reuniones"], 1], ["Que otros se rían de un apodo…", ["No significa que esté bien", "Es obligatorio", "Lo hace correcto"], 0], ["Corregir con respeto es…", ["Explicar qué cambiar", "Gritar", "Burlarse"], 0], ["¿Qué afecta la dignidad?", ["Un saludo", "Burlas y apodos ofensivos", "Una instrucción clara"], 1], ["El maltrato dentro del galpón…", ["No es aceptable, venga de quien venga", "Solo importa si lo hace un compañero", "Es normal"], 0]], "learn": ["Los apodos ofensivos dañan la dignidad.", "Que otros se rían no lo hace correcto.", "Se puede corregir con respeto."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J6={"sub": "Juzgar antes de conocer cierra puertas.", "ess": "Un <b>estereotipo</b> es una idea general de cómo «son» las personas de un grupo. Un <b>prejuicio</b> es juzgar a alguien <b>antes de conocerlo</b>. Las decisiones deben basarse en <b>requisitos e información real</b>.", "ex": "🐔 Pensar «esa persona no va a poder con el trabajo por su apariencia» sin haberla visto trabajar. Eso es un prejuicio.<br><br><b>Otro ejemplo:</b> «Los jóvenes son irresponsables» o «los mayores no aprenden tecnología». Son frases generales que no sirven para juzgar a una persona concreta: hay jóvenes muy responsables y mayores que aprenden rápido.", "ideas": ["<b>Estereotipo:</b> idea general de un grupo.", "<b>Prejuicio:</b> juzgar antes de conocer.", "<b>Mejor:</b> preguntar por experiencia y capacidades.", "Decidir con <b>información real</b>."], "deep": "<p>En lugar de decir «ese no sabe trabajar», pregunta: ¿qué experiencia tiene? ¿Qué capacitaciones tiene? ¿Qué pide el puesto?</p><p>Palabras que ayudan al trato justo: respeto, capacidad, criterio objetivo. Palabras que dañan: prejuicio, burla, exclusión.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Un supervisor piensa que «las mujeres se enferman más» y por eso no las propone para turnos importantes. Nunca revisó los datos ni preguntó a las trabajadoras.</p><p><b>Para pensar:</b> ¿Es un estereotipo? ¿Qué debería hacer el supervisor?</p></div><p>Un <b>estereotipo</b> es una idea general sobre un grupo. Un <b>prejuicio</b> es juzgar sin conocer. Ambos pueden llevar a decisiones injustas.</p>", "acts": [{"q": "Un estereotipo es una idea general sobre cómo son las personas de un grupo.", "g": "Mira la definición de la lectura.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: es una idea generalizada de un grupo."}, {"q": "Un prejuicio es juzgar a alguien antes de conocerlo.", "g": "Fíjate en la palabra «antes».", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: se juzga sin conocer sus capacidades."}, {"q": "«Los jóvenes no son responsables» es…", "g": "¿Habla de una persona o de todo un grupo?", "o": ["Un dato comprobado", "Un requisito", "Un estereotipo"], "c": 2, "e": "Es una idea general sobre un grupo: un estereotipo."}, {"q": "Es mejor decidir con información real que con prejuicios.", "g": "Piensa en qué se basa una decisión justa.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: la información real da decisiones justas."}, {"q": "¿Qué pregunta ayuda a conocer a una persona?", "g": "Busca la que se relaciona con el trabajo.", "o": ["¿De dónde viene?", "¿Qué experiencia y capacitaciones tiene?", "¿Cómo se ve?"], "c": 1, "e": "La experiencia y las capacitaciones se relacionan con la tarea."}, {"q": "La palabra «burla» ayuda a un trato justo.", "g": "¿La burla ayuda o daña?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: la burla daña el trato justo."}, {"q": "¿Cuál palabra ayuda al trato justo?", "g": "Piensa en una razón del trabajo.", "o": ["Exclusión", "Criterio objetivo", "Prejuicio"], "c": 1, "e": "El criterio objetivo ayuda a decidir con justicia."}, {"q": "Juzgar la capacidad de alguien por su apariencia es un prejuicio.", "g": "¿Se vio a la persona trabajar?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: es juzgar antes de conocer."}, {"q": "Antes de juzgar a una persona conviene…", "g": "Piensa en conocer a la persona.", "o": ["Preguntar solo al grupo", "Decidir rápido", "Conocer sus capacidades"], "c": 2, "e": "Conocer sus capacidades evita prejuicios."}, {"q": "Las decisiones deben basarse en requisitos e información pertinente.", "g": "Recuerda la idea clave final.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: eso hace que sean justas."}, {"q": "«Todos los jóvenes son irresponsables» es un estereotipo.", "g": "Es una idea general sobre un grupo.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Generaliza sin mirar a la persona."}, {"q": "Para evitar un estereotipo debo…", "g": "Piensa en conocer.", "o": ["Conocer a la persona y mirar su trabajo", "Guiarme por rumores", "Copiar lo que dicen otros"], "c": 0, "e": "Se juzga por hechos, no por ideas generales."}, {"q": "El supervisor que piensa «las mujeres se enferman más» debería…", "g": "Mira el caso de la lectura.", "o": ["Mantener su idea", "Contarle a todos su idea", "Revisar los hechos y evaluar a cada persona"], "c": 2, "e": "Decidir con hechos."}, {"q": "Un prejuicio es juzgar a alguien sin conocerlo.", "g": "Recuerda la definición.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Es una opinión formada antes de conocer."}, {"q": "Si escucho un comentario con estereotipos, puedo…", "g": "Piensa en qué ayuda.", "o": ["Reírme", "Aclarar con respeto que no todos son así", "Repetirlo"], "c": 1, "e": "Se puede corregir sin agredir."}], "chips": ["evito prejuicios", "es más justo", "veo lo que sabe hacer"], "rf": ["¿por qué es mejor conocer las capacidades de una persona antes de juzgarla?", "Porque así decido con información real y no con prejuicios.", "Porque"], "qz": [["Un prejuicio es…", ["Un requisito", "Juzgar antes de conocer", "Conocer bien"], 1], ["Un estereotipo es…", ["Un dato exacto", "Una regla", "Una idea general de un grupo"], 2], ["¿Qué palabra ayuda al trato justo?", ["Capacidad", "Burla", "Exclusión"], 0], ["En vez de «ese no sabe», lo mejor es…", ["Ignorarlo", "Preguntar por su experiencia", "Apartarlo"], 1], ["Las decisiones se basan en…", ["Información real y requisitos", "Apariencia", "Rumores"], 0]], "learn": ["Un prejuicio es juzgar antes de conocer.", "Un estereotipo es una idea general de un grupo.", "Hay que decidir con información real."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J7={"sub": "Al contratar se miran los requisitos, no las características personales.", "ess": "Al escoger personal se deben mirar los <b>requisitos del puesto, la experiencia, los conocimientos y las capacidades</b>. Una característica personal sin relación con el trabajo <b>no debe ser, por sí sola, motivo para dejar fuera</b> a alguien.", "ex": "🐔 Se busca un galponero. Llegan Mario (58 años, 20 de experiencia) y Kevin (22, sin experiencia). Escoger a Kevin «porque es joven» no es justo.<br><br><b>Otro ejemplo:</b> Para un puesto de clasificador, la empresa pide experiencia de 6 meses y disponibilidad para el turno de la mañana. Esos son requisitos del puesto. Pedir «buena presencia» o «que sea soltera» no tiene que ver con el trabajo.", "ideas": ["<b>Mirar</b> requisitos y experiencia.", "<b>Conocimientos</b> y capacidades.", "<b>No excluir</b> por edad u origen sin razón.", "<b>Comparar</b> a todos con los mismos criterios."], "deep": "<p>Para contratar a un galponero se revisa si tiene experiencia y cumple lo que pide el puesto, no cuántos años tiene ni de dónde viene.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Dos personas postulan a un puesto en el galpón. Una tiene 2 años de experiencia. La otra es sobrina del jefe y tiene 3 meses de experiencia. Contratan a la sobrina.</p><p><b>Para pensar:</b> ¿Qué criterio se usó? ¿Fue objetivo?</p></div><p>Contratar con <b>requisitos claros</b> y los mismos para todos ayuda a que el proceso sea justo y a que nadie se sienta excluido sin razón.</p>", "acts": [{"q": "Al contratar se deben mirar los requisitos del puesto.", "g": "Piensa en lo que pide el puesto.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: los requisitos son la base."}, {"q": "¿Qué se mira al escoger personal?", "g": "Busca lo que tiene que ver con el trabajo.", "o": ["El lugar de origen", "Requisitos, experiencia y capacidades", "La edad"], "c": 1, "e": "Se miran requisitos, experiencia, conocimientos y capacidades."}, {"q": "Descartar a alguien solo por su edad, aunque cumpla los requisitos, es justo.", "g": "¿Cumple los requisitos?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: la edad sola no es motivo."}, {"q": "Mario (58 años, 20 de experiencia) y Kevin (22, sin experiencia). Escoger a Kevin «porque es joven» es…", "g": "Pregunta: ¿se comparó la experiencia?", "o": ["Justo", "No justo: no se comparó la experiencia", "Obligatorio"], "c": 1, "e": "No es justo: se debió comparar requisitos y experiencia."}, {"q": "Se debe comparar a todos los candidatos con los mismos criterios.", "g": "Piensa en ser justo con todos.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: los mismos criterios para todos."}, {"q": "Una característica personal sin relación con el trabajo…", "g": "Recuerda la idea principal.", "o": ["Decide siempre", "Es un requisito", "No debe decidir por sí sola"], "c": 2, "e": "No debe ser, por sí sola, motivo para dejar fuera a alguien."}, {"q": "El lugar de origen es un requisito para ser galponero.", "g": "¿Qué pide realmente el puesto?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: el origen no es un requisito del trabajo."}, {"q": "¿Qué ayuda a contratar con justicia?", "g": "Piensa en las capacidades.", "o": ["Preferir jóvenes", "Mirar conocimientos y capacidades", "Preferir amigos"], "c": 1, "e": "Mirar conocimientos y capacidades da decisiones justas."}, {"q": "La experiencia relacionada con la tarea es un criterio válido al contratar.", "g": "¿Tiene relación con el trabajo?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: es un criterio objetivo."}, {"q": "Si alguien cumple los requisitos pero lo descartan por su edad, hay…", "g": "Recuerda la jornada 4.", "o": ["Discriminación", "Mala suerte", "Un ahorro"], "c": 0, "e": "Puede ser discriminación."}, {"q": "¿Cuál es un requisito válido para un puesto?", "g": "Debe tener que ver con el trabajo.", "o": ["Experiencia en la tarea", "Estado civil", "Tener hijos o no"], "c": 0, "e": "Los requisitos deben relacionarse con la tarea."}, {"q": "Preguntar a una candidata si piensa tener hijos es parte de una selección justa.", "g": "Piensa en el trabajo.", "o": ["Verdadero", "Falso"], "c": 1, "e": "No tiene relación con el trabajo y puede discriminar."}, {"q": "En el caso de la sobrina del jefe, ¿qué criterio se usó?", "g": "Es un favoritismo.", "o": ["La experiencia", "Un favoritismo, no uno objetivo", "El mérito"], "c": 1, "e": "No se eligió por requisitos del puesto."}, {"q": "Los requisitos del puesto deben ser iguales para todos los postulantes.", "g": "Es parte de la igualdad.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Mismos requisitos, mismo trato."}, {"q": "Si me piden datos personales que no tienen que ver con el trabajo, puedo…", "g": "Piensa en tus derechos.", "o": ["Dar todo sin preguntar", "Pelear", "Preguntar para qué sirven y avisar si me preocupa"], "c": 2, "e": "Se puede preguntar con respeto y avisar."}], "chips": ["requisitos", "experiencia", "capacidades"], "rf": ["¿qué criterio se debería usar al contratar?", "Se debería usar los requisitos del puesto y la experiencia.", "Se debería usar"], "qz": [["¿Qué se revisa al contratar?", ["Origen", "Requisitos y capacidades", "Edad"], 1], ["Descartar a alguien que cumple los requisitos solo por su edad es…", ["Un problema de discriminación", "Normal", "Justo"], 0], ["Un criterio válido al contratar es…", ["La experiencia relacionada", "La apariencia", "La amistad"], 0], ["Se debe comparar a los candidatos con…", ["Sus gustos", "Los mismos criterios", "Criterios distintos"], 1], ["El origen de una persona…", ["Es un requisito", "Define su capacidad", "No es un requisito del puesto"], 2]], "learn": ["Al contratar se miran requisitos y experiencia.", "La edad sola no es motivo para descartar.", "Se compara a todos con los mismos criterios."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J8={"sub": "Pagos y oportunidades se explican con razones del trabajo.", "ess": "Las diferencias de pago o de oportunidades deben explicarse con <b>razones del trabajo</b>: funciones, responsabilidades, preparación y condiciones. Las capacitaciones y el crecimiento también se dan con <b>reglas claras</b>.", "ex": "🐔 Hay un curso con 5 cupos y 8 interesados. Se revisa quién lo necesita para su tarea, no quién es amigo de quien decide.<br><br><b>Otro ejemplo:</b> Dos galponeros hacen el mismo trabajo. Uno gana menos solo por ser mujer o por ser de otra provincia. Es una brecha sin razón del trabajo. En cambio, quien tiene el turno de noche o una responsabilidad extra puede recibir un pago distinto con una razón clara.", "ideas": ["<b>Funciones</b> y responsabilidades.", "<b>Preparación</b> y condiciones.", "<b>Reglas claras</b> para capacitaciones.", "<b>No</b> amistad ni apariencia."], "deep": "<p>Criterios correctos: requisitos y responsabilidades del puesto; capacitación y experiencia relacionadas con la tarea. Criterios incorrectos: amistad con quien decide; apariencia sin relación con el puesto.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Marta pidió permiso varias veces para llevar a su hijo al médico. Desde entonces, ya no la consideran para capacitaciones ni ascensos.</p><p><b>Para pensar:</b> ¿Es justo? ¿Qué debería ocurrir?</p></div><p>Una <b>brecha salarial</b> es una diferencia de pago. Se analiza mirando tareas, responsabilidades, experiencia y requisitos del puesto. Una <b>brecha de oportunidades</b> aparece cuando algunas personas tienen menos acceso a capacitaciones o ascensos sin una razón del trabajo.</p>", "acts": [{"q": "Las diferencias de pago deben explicarse con razones del trabajo.", "g": "Piensa en funciones y responsabilidades.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: deben tener razones del trabajo."}, {"q": "¿Cuál es un criterio correcto para decidir?", "g": "Busca el que tiene que ver con el puesto.", "o": ["Apariencia personal", "Amistad con quien decide", "Responsabilidades del puesto"], "c": 2, "e": "Las responsabilidades del puesto son un criterio correcto."}, {"q": "La amistad con quien decide es un criterio válido.", "g": "¿Tiene que ver con el trabajo?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: no tiene relación con el trabajo."}, {"q": "Hay 5 cupos para un curso y 8 interesados. Lo justo es…", "g": "Piensa en la tarea de cada uno.", "o": ["Escoger a los amigos", "Revisar quién lo necesita para su tarea", "Sortear sin avisar"], "c": 1, "e": "Se revisa quién lo necesita para su tarea."}, {"q": "Las capacitaciones se dan con reglas claras.", "g": "Recuerda la idea clave.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: con reglas claras y conocidas."}, {"q": "La capacitación y la experiencia relacionadas con la tarea son…", "g": "Piensa en criterios objetivos.", "o": ["Favores", "Prejuicios", "Criterios válidos"], "c": 2, "e": "Son criterios válidos."}, {"q": "La apariencia personal sin relación con el puesto es un criterio válido.", "g": "¿Tiene relación con el puesto?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: no tiene relación con el puesto."}, {"q": "Una regla clara para dar una capacitación es…", "g": "Piensa en que todos se enteren.", "o": ["Elegir por amistad", "Avisar a todos", "Elegir en secreto"], "c": 1, "e": "Avisar a todos es una regla clara."}, {"q": "El crecimiento en la empresa también debe asignarse con criterios claros.", "g": "Recuerda la lectura.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: capacitación y crecimiento, con reglas claras."}, {"q": "Pagar distinto puede explicarse por…", "g": "Busca razones del trabajo.", "o": ["Responsabilidades y preparación", "Simpatía", "Origen"], "c": 0, "e": "Responsabilidades y preparación son razones del trabajo."}, {"q": "Una diferencia de pago siempre es discriminación.", "g": "Hay que mirar el motivo.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Puede estar justificada por razones del trabajo."}, {"q": "¿Qué se debe mirar para analizar un pago distinto?", "g": "Piensa en el trabajo.", "o": ["Tareas, responsabilidades y experiencia", "Quién cae mejor", "El género"], "c": 0, "e": "Se mira lo que tiene que ver con el trabajo."}, {"q": "En el caso de Marta, lo correcto es…", "g": "El permiso no debe castigarse.", "o": ["Dejarla fuera", "Sancionarla siempre", "Seguir considerándola para capacitaciones y ascensos"], "c": 2, "e": "Un permiso no debe quitar oportunidades."}, {"q": "Menos acceso a capacitaciones sin razón es una brecha de oportunidades.", "g": "Revisa la definición.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí, es una brecha de oportunidades."}, {"q": "Si creo que me pagan menos sin razón, puedo…", "g": "Piensa en cómo actuar.", "o": ["Dejar de trabajar", "Anotar y pedir una explicación a Talento Humano", "Reclamar a gritos"], "c": 1, "e": "Primero, información y diálogo."}], "chips": ["avisar a todos", "revisar quién la necesita", "explicar las reglas"], "rf": ["¿qué harías para que dar una capacitación sea justo?", "Yo haría que se avise a todos y se revise quién la necesita.", "Yo haría"], "qz": [["Las diferencias de pago se explican con…", ["Apariencia", "Razones del trabajo", "Amistad"], 1], ["Para dar una capacitación se deben usar…", ["Favores", "Sorpresas", "Reglas claras"], 2], ["¿Cuál NO es un criterio válido?", ["Amistad con quien decide", "Responsabilidades del puesto", "Experiencia en la tarea"], 0], ["Con 5 cupos y 8 interesados, se revisa…", ["Quién llega primero", "Quién lo necesita para su tarea", "Quién es amigo"], 1], ["El crecimiento se asigna con…", ["Preferencias", "Rumores", "Criterios claros"], 2]], "learn": ["Pagar distinto necesita razones del trabajo.", "Las capacitaciones se dan con reglas claras.", "La amistad no es un criterio."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J9={"sub": "Decidir con información que se puede comprobar.", "ess": "Una <b>decisión objetiva</b> se apoya en información que se puede <b>comprobar</b> y que tiene que ver con la tarea: experiencia, formación, capacitación y funciones del puesto.", "ex": "🐔 Para elegir al encargado de turno se revisa quién tiene experiencia, quién conoce las tareas y quién tiene capacitación.<br><br><b>Otro ejemplo:</b> Para asignar un turno extra, la empresa mira quién tiene disponibilidad, quién conoce la tarea y quién no ha hecho horas extras recientes. Anota la decisión. Así, cualquier trabajador puede entender por qué se eligió a esa persona.", "ideas": ["<b>Comprobable:</b> se puede verificar.", "<b>Relacionada</b> con la tarea.", "<b>Experiencia</b>, formación y capacitación.", "<b>No:</b> «me cae bien» ni «es mi amigo»."], "deep": "<p>Ejemplos de criterios objetivos: años de experiencia con las máquinas; curso de bioseguridad aprobado. No son objetivos: «me cae bien» o «es amigo mío».</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>El jefe necesita a alguien para supervisar un galpón. Elige a su amigo, que lleva 2 meses, y no a una compañera con 5 años y buenos resultados. Dice: «es de confianza».</p><p><b>Para pensar:</b> ¿La razón tiene que ver con el trabajo? ¿Cómo se podría decidir mejor?</p></div><p>Una decisión es <b>objetiva</b> cuando se basa en criterios del trabajo que se pueden explicar y aplicar a todos igual.</p>", "acts": [{"q": "Una decisión objetiva se apoya en información que se puede comprobar.", "g": "Piensa en datos que se pueden verificar.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: se puede comprobar."}, {"q": "¿Cuál es un criterio objetivo?", "g": "Busca el que se puede verificar.", "o": ["Es amigo mío", "Años de experiencia con las máquinas", "Me cae bien"], "c": 1, "e": "La experiencia se puede comprobar."}, {"q": "«Me cae bien» es un criterio objetivo.", "g": "¿Se puede comprobar?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: es una simpatía, no se puede comprobar."}, {"q": "Para elegir al encargado de turno se revisa…", "g": "Piensa en la tarea.", "o": ["Experiencia, conocimiento de tareas y capacitación", "Quién cae mejor", "Quién llegó primero"], "c": 0, "e": "Se revisa experiencia, tareas y capacitación."}, {"q": "Un curso de bioseguridad aprobado es un criterio objetivo.", "g": "¿Se puede comprobar con un certificado?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: se puede comprobar y tiene relación con la tarea."}, {"q": "Una decisión objetiva tiene que ver con…", "g": "Recuerda la definición.", "o": ["La simpatía", "El origen", "La tarea"], "c": 2, "e": "Tiene que ver con la tarea."}, {"q": "«Es amigo mío» es una razón objetiva.", "g": "¿Se relaciona con el trabajo?", "o": ["Verdadero", "Falso"], "c": 1, "e": "No: no tiene relación con el trabajo."}, {"q": "Para asignar una responsabilidad se revisan…", "g": "Piensa en el puesto.", "o": ["El apellido", "Los requisitos del puesto y las capacidades", "Los gustos del jefe"], "c": 1, "e": "Se revisan requisitos del puesto y capacidades."}, {"q": "La formación y la capacitación pueden usarse como criterios objetivos.", "g": "¿Están relacionadas con la tarea?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí: son criterios objetivos."}, {"q": "Una información comprobable es…", "g": "Piensa en verificar.", "o": ["La que se puede verificar", "La que se escucha", "La que se supone"], "c": 0, "e": "Es la que se puede verificar."}, {"q": "¿Qué hace objetiva a una decisión?", "g": "Piensa en explicar.", "o": ["Que la tome el jefe", "Que se base en criterios del trabajo y se pueda explicar", "Que sea rápida"], "c": 1, "e": "Los criterios claros dan transparencia."}, {"q": "Elegir por amistad es una decisión objetiva.", "g": "Piensa en el trabajo.", "o": ["Verdadero", "Falso"], "c": 1, "e": "La amistad no es un criterio del trabajo."}, {"q": "En el caso del supervisor, ¿cuál sería un mejor criterio?", "g": "Piensa en méritos.", "o": ["Experiencia, resultados y conocimiento de la tarea", "La confianza personal", "Quién habla más"], "c": 0, "e": "Se decide con criterios del puesto."}, {"q": "Dejar por escrito las razones ayuda a que las decisiones sean más claras.", "g": "Transparencia.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Anotar las razones ayuda a explicar y revisar."}, {"q": "Si no entiendo por qué me eligieron o no, puedo…", "g": "Piensa en dialogar.", "o": ["Enojarme", "Callar", "Pedir con respeto que me expliquen los criterios"], "c": 2, "e": "Preguntar con respeto es válido."}], "chips": ["la experiencia", "la capacitación", "las funciones del puesto"], "rf": ["menciona un ejemplo de criterio objetivo", "Un criterio objetivo es los años de experiencia.", "Un criterio objetivo es"], "qz": [["Una decisión objetiva se apoya en…", ["Rumores", "Información comprobable", "Simpatía"], 1], ["¿Cuál es un criterio objetivo?", ["«Me cae bien»", "«Es mi amigo»", "Curso aprobado"], 2], ["Para elegir encargado de turno se revisa…", ["Experiencia y capacitación", "Quién cae mejor", "Quién habla más"], 0], ["«Es amigo mío» es…", ["Un requisito", "Una razón objetiva", "No una razón objetiva"], 2], ["La información objetiva tiene relación con…", ["Los gustos", "El origen", "La tarea"], 2]], "learn": ["Una decisión objetiva se puede comprobar.", "Se revisan experiencia, formación y funciones.", "Caer bien no es un criterio."], "act": ["Escuchar sin burlarme.", "Hablar con respeto.", "Avisar si veo algo injusto."]};
const J10={"sub": "El respeto se nota en el trato de todos los días.", "ess": "El <b>trato cotidiano</b> es cómo nos hablamos, cómo bromeamos y cómo repartimos el trabajo cada día. Ahí se ve si hay <b>respeto</b> de verdad.", "ex": "En un galpón, a un compañero le dicen por apodo algo sobre su cuerpo. Todos se ríen menos él. Aunque «sea costumbre», no es un trato respetuoso.<br><br><b>Otro ejemplo:</b> En la charla de seguridad de la mañana, un compañero nuevo hace una pregunta. Alguien se ríe y dice «eso ya lo sabe todo el mundo». Mejor sería responderle con paciencia: así más personas se animan a preguntar y hay menos accidentes.", "ideas": ["<b>Lenguaje respetuoso:</b> usamos el nombre de cada persona.", "<b>Bromas sin ofender:</b> si alguien se incomoda, paramos.", "<b>Tareas repartidas con criterio:</b> por el trabajo, no por simpatías.", "<b>Escuchar a todos:</b> todas las voces cuentan."], "deep": "<p>Lo que para una persona es una broma, para otra puede ser una ofensa. Lo que importa es <b>cómo le llega</b> a la otra persona.</p><p>Evitamos apodos y comentarios sobre el <b>cuerpo, el origen, la edad, la etnia</b> o la forma de hablar.</p><p>Cuando repartimos tareas, turnos o equipos, usamos <b>criterios del trabajo</b>: experiencia, tarea y necesidad del puesto.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>En el vestidor, algunos compañeros imitan la forma de caminar de un trabajador y todos se ríen. Él sonríe, pero evita ir al vestidor cuando hay gente.</p><p><b>Para pensar:</b> ¿Es solo una broma? ¿Cómo se podría cambiar esta situación?</p></div><p>Cuando alguien <b>evita un lugar o se aísla</b>, puede ser una señal de que algo le incomoda aunque no lo diga.</p>", "acts": [{"q": "Un apodo sobre el aspecto físico de un compañero es solo una broma sin importancia.", "g": "Piensa en cómo se siente la persona que recibe el apodo, no en quien lo dice.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Lo que para uno es broma puede doler a otro. Importa el efecto, no solo la intención."}, {"q": "¿Cuál es una forma respetuosa de pedir algo a un compañero?", "g": "Busca la frase que usa «por favor» y el nombre de la persona.", "o": ["«Juan, ¿me ayudas con esto, por favor?»", "«¡Oye, tú, apúrate!»", "«Eso hazlo tú, para eso estás»"], "c": 0, "e": "El trato respetuoso incluye el nombre, la cortesía y un tono amable."}, {"q": "Si nadie se ríe de una burla, entonces no ofendió.", "g": "Hay personas que callan aunque se sientan mal.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Muchas personas se quedan calladas por miedo o vergüenza, aunque se sientan ofendidas."}, {"q": "En el galpón, ¿qué es un reparto justo de tareas?", "g": "Piensa en criterios del trabajo, no en simpatías.", "o": ["Dar lo más pesado siempre al más callado", "Repartir según la tarea, la experiencia y el turno", "Dar lo más fácil a los amigos"], "c": 1, "e": "Las tareas se reparten con criterios del trabajo, no por preferencias."}, {"q": "Hacer comentarios sobre el origen, la edad o el cuerpo de alguien puede ser irrespetuoso.", "g": "Recuerda las ideas clave: lenguaje respetuoso.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Esos comentarios pueden ofender y afectar el ambiente de trabajo."}, {"q": "Si un compañero te pide que no uses cierto apodo, ¿qué haces?", "g": "Respetar lo que la persona pide es parte del buen trato.", "o": ["Sigo usándolo, es costumbre", "Lo uso más para que se acostumbre", "Dejo de usarlo y le pido disculpas"], "c": 2, "e": "Si alguien dice que algo le molesta, lo respetamos."}, {"q": "Escuchar la opinión de todos en una charla de seguridad es parte del trato respetuoso.", "g": "¿Todos tienen algo que aportar?", "o": ["Verdadero", "Falso"], "c": 0, "e": "Escuchar a todos mejora el trabajo en equipo y también la seguridad."}, {"q": "¿Qué ayuda a que todos se sientan bien en el equipo?", "g": "Piensa en lo que se puede hacer cada día.", "o": ["Hablar solo con los de mi grupo", "Saludar y llamar a todos por su nombre", "Ignorar a los nuevos"], "c": 1, "e": "Los pequeños gestos de cada día construyen un buen ambiente."}, {"q": "La intención de quien hace la broma es lo único que cuenta.", "g": "Mira la primera pregunta de esta jornada.", "o": ["Verdadero", "Falso"], "c": 1, "e": "También cuenta cómo le llega a la otra persona."}, {"q": "Ves que se burlan de un compañero por su forma de hablar. Lo mejor es…", "g": "No reírme y no seguir la burla ya ayuda.", "o": ["No reírme y apoyar al compañero", "Reírme para no quedar mal", "Grabar el momento para divertirme"], "c": 0, "e": "No sumarse a la burla y apoyar a la persona es una acción positiva."}, {"q": "Si alguien sonríe ante una burla, quiere decir que no le molesta.", "g": "Algunas personas sonríen por vergüenza.", "o": ["Verdadero", "Falso"], "c": 1, "e": "No siempre; puede sonreír por presión."}, {"q": "Si veo que se burlan de un compañero, lo mejor es…", "g": "Piensa en apoyo.", "o": ["No sumarme y apoyar al compañero", "Reírme", "Grabarlo"], "c": 0, "e": "No seguir la burla ayuda a frenarla."}, {"q": "Una persona que evita el vestidor por las burlas puede estar…", "g": "Mira el caso.", "o": ["Feliz", "Incómoda y afectada", "Aburrida"], "c": 1, "e": "Evitar un lugar es una señal de incomodidad."}, {"q": "Responder con paciencia una pregunta ayuda a que todos se animen a preguntar.", "g": "Piensa en la charla de seguridad.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Un ambiente respetuoso mejora la seguridad."}, {"q": "Para mejorar el trato diario puedo…", "g": "Piensa en lo cotidiano.", "o": ["Saludar, agradecer y no seguir burlas", "Competir con los demás", "Ignorar a todos"], "c": 0, "e": "El trato diario se construye con gestos simples."}], "chips": ["escuchar sin burlarme", "llamar a todos por su nombre", "parar si algo incomoda"], "rf": ["¿cómo puedes mejorar el trato diario en tu área?", "Puedo mejorar el trato diario saludando a todos por su nombre.", "Puedo mejorar el trato diario"], "qz": [["¿Cuál es una forma respetuosa de pedir algo a un compañero?", ["«Juan, ¿me ayudas con esto, por favor?»", "«¡Oye, tú, apúrate!»", "«Eso hazlo tú, para eso estás»"], 0], ["En el galpón, ¿qué es un reparto justo de tareas?", ["Dar lo más pesado siempre al más callado", "Repartir según la tarea, la experiencia y el turno", "Dar lo más fácil a los amigos"], 1], ["Si un compañero te pide que no uses cierto apodo, ¿qué haces?", ["Sigo usándolo, es costumbre", "Lo uso más para que se acostumbre", "Dejo de usarlo y le pido disculpas"], 2], ["¿Qué ayuda a que todos se sientan bien en el equipo?", ["Hablar solo con los de mi grupo", "Saludar y llamar a todos por su nombre", "Ignorar a los nuevos"], 1], ["Ves que se burlan de un compañero por su forma de hablar. Lo mejor es…", ["No reírme y apoyar al compañero", "Reírme para no quedar mal", "Grabar el momento para divertirme"], 0]], "learn": ["Una broma que ofende deja de ser broma.", "El trato diario muestra el respeto.", "Las tareas se reparten con criterios del trabajo."], "act": ["Llamar a todos por su nombre.", "No seguir burlas.", "Pedir disculpas si ofendo."]};
const J11={"sub": "Saber qué hacer nos da seguridad para actuar.", "ess": "Si vives o ves discriminación: <b>1)</b> mantén la calma, <b>2)</b> anota lo ocurrido, <b>3)</b> avisa en tu empresa y, si no hay respuesta, <b>4)</b> acude al Ministerio del Trabajo.", "ex": "Rosa escucha a un compañero burlarse de otra trabajadora por su acento. Rosa anota la fecha y lo que dijo, y avisa a Talento Humano. Nadie debe castigarla por avisar.<br><br><b>Otro ejemplo:</b> Juan anotó en su cuaderno: «Martes 14, a las 10:00, en el galpón 2, el supervisor dijo delante de todos que ‘las mujeres no sirven para cargar’». Con esos datos, Talento Humano puede revisar el caso con claridad.", "ideas": ["<b>Calma:</b> no respondo con agresión.", "<b>Registro:</b> anoto fecha, lugar y hechos.", "<b>Aviso:</b> jefe, Talento Humano o canal de la empresa.", "<b>Protección:</b> sin represalias y con confidencialidad."], "deep": "<p>Avisar <b>no es chismear</b>: es cuidar un ambiente de trabajo respetuoso.</p><p>No necesitas pruebas perfectas. Cuenta lo que pasó con honestidad: <b>qué, cuándo, dónde y quiénes</b>.</p><p>La empresa debe revisar el caso y proteger a la persona que avisó. Si no hay respuesta, puedes acudir al <b>Ministerio del Trabajo</b>.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Sofía avisó de un mal trato y a los pocos días le cambiaron el turno sin explicación a uno que le complica llegar.</p><p><b>Para pensar:</b> ¿Qué podría ser esto? ¿A quién puede acudir?</p></div><p>Si un cambio perjudica a alguien <b>después de avisar</b>, puede ser una <b>represalia</b>. Conviene anotarlo también y avisar.</p>", "acts": [{"q": "Si veo un trato discriminatorio, lo mejor es quedarme callado para no tener problemas.", "g": "Piensa en qué pasa si nadie dice nada.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Callar permite que el problema continúe. Hay maneras seguras de avisar."}, {"q": "Primer paso al vivir o ver una situación de discriminación:", "g": "Antes de actuar conviene mantener la calma.", "o": ["Mantener la calma y no responder con agresión", "Responder con insultos", "Hacer justicia por mi cuenta"], "c": 0, "e": "Mantener la calma ayuda a actuar bien y protegerse."}, {"q": "Anotar qué pasó (fecha, lugar y qué se dijo) ayuda a explicar la situación después.", "g": "Los detalles se olvidan con el tiempo.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Los datos claros ayudan a que se entienda lo ocurrido."}, {"q": "¿A quién se puede avisar dentro de la empresa?", "g": "Piensa en quién tiene responsabilidad en la empresa.", "o": ["Solo a los compañeros del turno", "A mi jefe directo, a Talento Humano o al canal que la empresa indique", "A nadie, se resuelve solo"], "c": 1, "e": "La empresa debe tener personas o canales para recibir estos avisos."}, {"q": "Si en la empresa no hay respuesta, existen instituciones como el Ministerio del Trabajo a donde se puede acudir.", "g": "Recuerda que la ley protege a todos los trabajadores.", "o": ["Verdadero", "Falso"], "c": 0, "e": "El Ministerio del Trabajo atiende denuncias laborales."}, {"q": "¿Qué es una represalia?", "g": "Es lo contrario de proteger a quien avisa.", "o": ["Un premio por avisar", "Una reunión de equipo", "Un castigo contra quien avisó o denunció"], "c": 2, "e": "No debe haber castigos por avisar de buena fe."}, {"q": "Quien avisa de una situación injusta debe ser tratado con confidencialidad y respeto.", "g": "Piensa en por qué la gente no avisa.", "o": ["Verdadero", "Falso"], "c": 0, "e": "La confidencialidad protege a quienes se animan a hablar."}, {"q": "Un compañero te cuenta que se siente maltratado. ¿Qué haces?", "g": "Escuchar y orientar es lo más útil.", "o": ["Lo escucho y le cuento a quién puede avisar", "Le digo que exagera", "Se lo cuento a todos del galpón"], "c": 0, "e": "Escuchar con respeto y orientar ayuda más que juzgar."}, {"q": "Para avisar de una situación necesito tener pruebas perfectas.", "g": "Basta con contar lo que pasó con honestidad.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Basta explicar lo que pasó con honestidad; la empresa debe revisar el caso."}, {"q": "¿Cuál es el orden correcto?", "g": "Calma, anotar, avisar.", "o": ["Avisar → olvidar → calmarme", "Calma → anotar lo ocurrido → avisar", "Gritar → avisar → anotar"], "c": 1, "e": "Primero calma, luego registrar los hechos y después avisar."}, {"q": "¿Qué datos conviene anotar de una situación?", "g": "Para explicarla después.", "o": ["Fecha, lugar, qué pasó y quiénes estaban", "Solo mi opinión", "Nada"], "c": 0, "e": "Los datos concretos ayudan a revisar el caso."}, {"q": "Cambiar el turno de Sofía sin explicación después de avisar podría ser una represalia.", "g": "Piensa en castigo por avisar.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Debe revisarse y avisar."}, {"q": "Si el aviso interno no tiene respuesta, puedo…", "g": "Hay otras instituciones.", "o": ["Rendirme", "Acudir al Ministerio del Trabajo", "Publicarlo en redes"], "c": 1, "e": "Existen instancias del Estado."}, {"q": "Avisar de una injusticia es chismear.", "g": "Piensa en el ambiente.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Avisar cuida un ambiente respetuoso."}, {"q": "Al avisar, lo ideal es contar…", "g": "Con honestidad.", "o": ["Rumores", "Exageraciones", "Lo que pasó, con hechos"], "c": 2, "e": "Los hechos dan claridad."}], "chips": ["avisar a tiempo", "anotar lo ocurrido", "apoyar a quien lo necesita"], "rf": ["¿a quién avisarías en tu empresa?", "Avisaría a mi jefe o a Talento Humano.", "Yo avisaría a"], "qz": [["Primer paso al vivir o ver una situación de discriminación:", ["Mantener la calma y no responder con agresión", "Responder con insultos", "Hacer justicia por mi cuenta"], 0], ["¿A quién se puede avisar dentro de la empresa?", ["Solo a los compañeros del turno", "A mi jefe directo, a Talento Humano o al canal que la empresa indique", "A nadie, se resuelve solo"], 1], ["¿Qué es una represalia?", ["Un premio por avisar", "Una reunión de equipo", "Un castigo contra quien avisó o denunció"], 2], ["Un compañero te cuenta que se siente maltratado. ¿Qué haces?", ["Lo escucho y le cuento a quién puede avisar", "Le digo que exagera", "Se lo cuento a todos del galpón"], 0], ["¿Cuál es el orden correcto?", ["Avisar → olvidar → calmarme", "Calma → anotar lo ocurrido → avisar", "Gritar → avisar → anotar"], 1]], "learn": ["Calma, anotar y avisar.", "Nadie debe recibir castigo por avisar.", "Existe el Ministerio del Trabajo."], "act": ["Avisar si veo algo injusto.", "Anotar lo ocurrido.", "Apoyar a quien lo vive."]};
const J12={"sub": "Aplicamos lo aprendido a situaciones del trabajo real.", "ess": "En el <b>caso práctico</b> usamos todo lo aprendido: igualdad, criterios objetivos, trato respetuoso y cómo actuar.", "ex": "Una forma sencilla de analizar un caso: <b>¿qué pasó?</b> → <b>¿el motivo tiene que ver con el trabajo?</b> → <b>¿qué debería hacerse?</b><br><br><b>Un método para todos los casos:</b> 1) ¿Qué pasó, con hechos? 2) ¿El motivo tiene que ver con el trabajo? 3) ¿Qué trato igual y respetuoso correspondería? 4) ¿Qué debo hacer yo: calma, anotar, avisar?", "ideas": ["<b>Mirar los hechos:</b> qué pasó realmente.", "<b>Revisar el motivo:</b> ¿es del trabajo o de la persona?", "<b>Pensar en la solución:</b> trato igual y respeto.", "<b>Actuar:</b> calma, anotar, avisar."], "deep": "<p>Si una decisión se basa en el <b>sexo, la edad, el origen, la discapacidad</b> u otra condición personal y no en las tareas del puesto, puede ser <b>discriminación</b>.</p><p>Si el motivo es la <b>experiencia, la tarea o el resultado</b>, es una decisión <b>objetiva</b>.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Dos compañeros reclaman porque a uno le pagan menos. El supervisor responde: «así es y punto». No hay ninguna razón del trabajo que lo explique.</p><p><b>Para pensar:</b> Aplica el método de 4 preguntas. ¿Qué debería hacer la empresa?</p></div><p>En un caso real, conviene <b>escuchar a las dos partes</b>, revisar los hechos y decidir con criterios del trabajo.</p>", "acts": [{"q": "Caso 1: Un galponero nuevo recibe siempre el turno más pesado «por ser nuevo». ¿Qué falta?", "g": "Piensa en criterios objetivos.", "o": ["Un criterio objetivo y un reparto rotativo", "Más burlas", "Nada, es normal"], "c": 0, "e": "El reparto debe tener criterios claros y justos para todos."}, {"q": "Caso 2: Se necesita un operario. Se descarta a una mujer solo por ser mujer. Esto es…", "g": "¿El motivo tiene que ver con el trabajo?", "o": ["Discriminación", "Una decisión objetiva", "Una casualidad"], "c": 0, "e": "Descartar por el sexo y no por la capacidad es discriminación."}, {"q": "Caso 3: Un trabajador de 55 años no es invitado a una capacitación «porque ya es mayor». Lo correcto es…", "g": "La edad no define la capacidad de aprender.", "o": ["No invitarlo", "Invitarlo, como a los demás", "Invitarlo solo si insiste"], "c": 1, "e": "Todos tienen derecho a capacitarse, sin importar la edad."}, {"q": "Caso 4: Un supervisor dice «las mujeres no pueden cargar jaulas». Es un…", "g": "Piensa en generalizar a todo un grupo.", "o": ["Dato de la ley", "Requisito del puesto", "Estereotipo"], "c": 2, "e": "Un estereotipo es una idea general que no mira a la persona real."}, {"q": "Caso 5: Una compañera con discapacidad pide una silla para su tarea. La empresa debe…", "g": "Piensa en inclusión.", "o": ["Revisar el pedido y buscar un ajuste razonable", "Negarse sin revisar", "Cambiarla de puesto sin preguntarle"], "c": 0, "e": "Hay que escuchar y buscar ajustes posibles para que pueda trabajar bien."}, {"q": "Caso 6: Pagar menos a alguien por su origen, haciendo el mismo trabajo, es discriminación.", "g": "Mismo trabajo, mismo trato.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Sí. Las diferencias de pago deben explicarse por razones del trabajo."}, {"q": "Caso 7: Escuchas que se burlan de un compañero por su origen. Lo mejor es…", "g": "Recuerda el orden: calma, anotar, avisar.", "o": ["Reírme", "No sumarme, apoyar y avisar si continúa", "Ignorar siempre"], "c": 1, "e": "No seguir la burla y avisar a tiempo ayuda a frenar el problema."}, {"q": "Caso 8: Escoger a alguien para un ascenso por su experiencia y resultados es una decisión objetiva.", "g": "Hablamos de criterios del trabajo.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Experiencia y resultados son criterios objetivos."}, {"q": "Caso 9: Alguien avisó de un mal trato y ahora le dan los peores turnos. Esto es…", "g": "Un castigo por avisar.", "o": ["Un premio", "Una rotación normal", "Una represalia"], "c
