": 2, "e": "Castigar a quien avisó es una represalia y no debe pasar."}, {"q": "Caso 10: ¿Qué ayuda más a prevenir estos casos?", "g": "Piensa en lo que aprendiste.", "o": ["Normas claras, respeto y avisar a tiempo", "Callar", "Culpar a las víctimas"], "c": 0, "e": "La prevención combina reglas claras, buen trato y comunicación."}, {"q": "Primera pregunta del método para analizar un caso:", "g": "Empieza por los hechos.", "o": ["¿Qué pasó, con hechos?", "¿Quién tiene la culpa?", "¿Quién me cae mejor?"], "c": 0, "e": "Se parte de los hechos."}, {"q": "«Así es y punto» es una respuesta suficiente para explicar una diferencia de pago.", "g": "Piensa en dar razones.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Se necesitan razones del trabajo que se puedan explicar."}, {"q": "En un caso real, lo mejor es…", "g": "Piensa en justicia.", "o": ["Decidir sin escuchar", "Escuchar a las dos partes y revisar hechos", "Esperar a que pase"], "c": 1, "e": "Escuchar ayuda a decidir bien."}, {"q": "Un caso debe resolverse con criterios del trabajo y trato respetuoso.", "g": "Resumen de la jornada.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Ese es el enfoque del módulo."}, {"q": "Si en un caso alguien sufre un maltrato, mi paso básico es…", "g": "Calma, anotar, avisar.", "o": ["Callar", "Burlarme", "Mantener la calma, anotar y avisar"], "c": 2, "e": "Es el camino seguro."}], "chips": ["mirar los hechos", "pensar en el motivo", "actuar con respeto"], "rf": ["¿qué caso te pareció más cercano a tu trabajo?", "El caso más cercano fue el del reparto de tareas, y yo haría un reparto más justo.", "El caso más cercano fue"], "qz": [["Caso 1: Un galponero nuevo recibe siempre el turno más pesado «por ser nuevo». ¿Qué falta?", ["Un criterio objetivo y un reparto rotativo", "Más burlas", "Nada, es normal"], 0], ["Caso 2: Se necesita un operario. Se descarta a una mujer solo por ser mujer. Esto es…", ["Discriminación", "Una decisión objetiva", "Una casualidad"], 0], ["Caso 4: Un supervisor dice «las mujeres no pueden cargar jaulas». Es un…", ["Dato de la ley", "Requisito del puesto", "Estereotipo"], 2], ["Caso 7: Escuchas que se burlan de un compañero por su origen. Lo mejor es…", ["Reírme", "No sumarme, apoyar y avisar si continúa", "Ignorar siempre"], 1], ["Caso 9: Alguien avisó de un mal trato y ahora le dan los peores turnos. Esto es…", ["Un premio", "Una rotación normal", "Una represalia"], 2]], "learn": ["Un caso se analiza con tres preguntas.", "El motivo debe tener que ver con el trabajo.", "Callar no resuelve."], "act": ["Revisar el motivo antes de decidir.", "Tratar igual situaciones iguales.", "Avisar si veo un caso así."]};
const J13={"sub": "Repasamos lo más importante antes de cerrar.", "ess": "Hoy <b>repasamos</b>: igualdad, no discriminación, trato respetuoso, decisiones objetivas y cómo actuar si algo no está bien.", "ex": "Repasar es como revisar el equipo antes del turno: así nos aseguramos de que todo funciona bien.<br><br><b>Mini repaso:</b> Igualdad = mismas oportunidades. Discriminación = trato desigual por una condición personal sin razón del trabajo. Objetividad = decidir por criterios del trabajo. Acción = calma, anotar, avisar.", "ideas": ["<b>Igualdad:</b> mismas oportunidades y trato justo.", "<b>Discriminación:</b> trato desigual por una condición personal.", "<b>Objetividad:</b> decidir por el trabajo.", "<b>Actuar:</b> calma, anotar, avisar."], "deep": "<p>Recuerda las <b>tres preguntas</b> para analizar un caso: ¿qué pasó?, ¿el motivo tiene que ver con el trabajo?, ¿qué debería hacerse?</p><p>Y recuerda siempre: <b>respeto en el trato diario</b>.</p><div class=\"bx b\"><h3>Caso para analizar</h3><p>Un trabajador te cuenta que lo excluyen de las charlas porque «ya es mayor». Tú recuerdas lo aprendido en el módulo.</p><p><b>Para pensar:</b> ¿Cómo le ayudarías? Piensa en tres pasos.</p></div><p>Repasar ayuda a que lo aprendido se vuelva <b>costumbre</b> en el trabajo.</p>", "acts": [{"q": "La igualdad significa que todos hagan exactamente el mismo trabajo.", "g": "Jornada 2.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Igualdad es mismas oportunidades y trato justo; los puestos pueden ser distintos."}, {"q": "La discriminación es…", "g": "Jornada 4.", "o": ["Un trato desigual sin razón del trabajo, por una condición personal", "Un trato distinto por la experiencia", "Una sanción por llegar tarde"], "c": 0, "e": "La discriminación parte de una condición personal, no de razones del trabajo."}, {"q": "Un estereotipo es una idea general que no mira a la persona real.", "g": "Jornada 6.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Los estereotipos simplifican y pueden llevar a decisiones injustas."}, {"q": "¿Cuál es un criterio objetivo para contratar?", "g": "Jornada 7.", "o": ["La apariencia", "La experiencia y los requisitos del puesto", "La amistad"], "c": 1, "e": "Se contrata por lo que se necesita para el trabajo."}, {"q": "Una diferencia de pago puede explicarse por la tarea, la responsabilidad y la experiencia.", "g": "Jornada 8.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Si es por razones del trabajo, puede estar justificada."}, {"q": "En una decisión objetiva se mira…", "g": "Jornada 9.", "o": ["Lo que tiene que ver con el trabajo", "Quién me cae mejor", "El apellido"], "c": 0, "e": "Los criterios del trabajo son la base."}, {"q": "Si algo incomoda a un compañero, seguimos con la broma porque es costumbre.", "g": "Jornada 10.", "o": ["Verdadero", "Falso"], "c": 1, "e": "Si incomoda, paramos."}, {"q": "Al ver discriminación, el orden recomendado es…", "g": "Jornada 11.", "o": ["Avisar → gritar → olvidar", "Esperar a que pase", "Calma → anotar → avisar"], "c": 2, "e": "Primero calma, luego registrar y avisar."}, {"q": "Nadie debe ser castigado por avisar de buena fe.", "g": "Jornada 11.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Eso sería una represalia."}, {"q": "Esta capacitación es…", "g": "Jornada 1.", "o": ["Un favor", "Una obligación legal de la empresa", "Solo para jefes"], "c": 1, "e": "Es parte de las obligaciones legales."}, {"q": "La igualdad busca…", "g": "Repaso.", "o": ["Mismas oportunidades y trato justo", "Que todos ganen lo mismo", "Que nadie opine"], "c": 0, "e": "Es la definición base."}, {"q": "Un estereotipo puede llevar a una decisión injusta.", "g": "Repaso.", "o": ["Verdadero", "Falso"], "c": 0, "e": "Por eso se deben revisar los hechos."}, {"q": "Un criterio objetivo es…", "g": "Repaso.", "o": ["Una simpatía", "Una razón que tiene que ver con el trabajo", "Un rumor"], "c": 1, "e": "Se explica y se aplica igual a todos."}, {"q": "Después de avisar de una injusticia, la empresa puede castigar a quie else{const a=J.acts[i],r=T.a[k];h+=`<h2>2. Practicar · Actividad ${i+1} de ${n} <span class="small">⭐ ${Object.keys(T.a).filter(k=>k[0]=="p").reduce((x,k)=>x+T.a[k],0)}</span></h2><p><b>${a.q}</b></p><details ${r===undefined?"open":""}><summary>Guía para pensar</summary>${a.g}</details>`;a.o.forEach((o,x)=>{let c="opt";if(r!==undefined){if(x===a.c)c+=" ok2";else if(T.sel[k]===x)c+=" bad"}h+=`<button class="${c}" data-p="${k}" data-i="${x}" data-c="${a.c}">${o}</button>`});
if(r!==undefined)h+=`<div class="why ${r?"":"bad"}">${r?"¡Correcto! ":"Casi. "}La respuesta correcta es <b>${a.o[a.c]}</b>. ${a.e}</div><button class="go" data-np="1">${i+1<n?"Siguiente actividad":"Terminar las actividades"}</button>`}}
else if(T.step===2){h+=`<h2>3. Responder</h2>`;
if(T.pass){h+=`<div class="why">¡Muy bien! Respondiste todo correctamente${T.tries>1?" en el intento "+T.tries:""}.</div><button class="go" data-go="3">Continuar</button>`}
else if(T.fail){h+=`<div class="why bad"><b>Aún no.</b> Hay respuestas por corregir. Repasa la información y vuelve a intentarlo: debes responder todo bien para continuar.</div><button class="go" data-go="0">Volver a leer</button><button class="back" id="rt" style="display:block;margin:6px auto">Intentar de nuevo</button>`}
else{h+=`<p class="small">Responde con calma. Aquí no hay pistas: tienes que responder todo bien para pasar.</p>`;const rot=T.tries%3;J.qz.forEach((q,qi)=>{const k="q"+qi;h+=`<p><b>${qi+1}. ${q[0]}</b></p>`;[0,1,2].map(i=>(i+rot)%3).forEach(oi=>{h+=`<button class="opt${T.r[k]===oi?" pick":""}" data-r="${k}" data-i="${oi}">${q[1][oi]}</button>`})});h+=`<button class="go" id="sb2" ${J.qz.every((_,i)=>T.r["q"+i]!==undefined)?"":"disabled"}>Enviar mis respuestas</button>`}}
else{h+=`<h2>4. Terminar</h2><p><b>Hoy aprendí</b> (toca una):</p>`;J.learn.forEach(x=>h+=`<button class="opt${T.di.l===x?" ok2":""}" data-d="l" data-v="${esc(x)}">${x}</button>`);
 h+=`<p><b>Lo puedo aplicar en mi trabajo</b> (toca una):</p>`;J.act.forEach(x=>h+=`<button class="opt${T.di.u===x?" ok2":""}" data-d="u" data-v="${esc(x)}">${x}</button>`);
 h+=`<p><b>¿Cómo me fue?</b></p>`;["Me gustó","Más o menos","Me costó"].forEach(x=>h+=`<button class="chip${T.di.f===x?" on":""}" data-d="f" data-v="${x}">${x}</button>`);
 if(T.di.l&&T.di.u&&T.di.f){T.fin=true;S.max=Math.max(S.max,Math.min(15,S.cur+1));const[o,t]=scoreOf(),min=Math.max(1,Math.round(T.secs/60)),d=new Date().toLocaleDateString("es-EC"),tx=`Constancia · Capacitación Avícola La Lojana · Jornada ${S.cur}\nNombre: ${S.name}\nFecha: ${d}\nTiempo real: ${min} min\nPráctica: ${o} de ${t}\nEvaluación: aprobada en ${T.tries} intento(s)\nMe fue: ${T.di.f}`;
 h+=`<div class="sum"><b>${esc(S.name)}</b><div class="big">${min} min</div><div class="small">Tiempo real · Práctica ${o} de ${t} (primer intento) · Evaluación en ${T.tries} intento(s) · ${d}</div></div><a class="share" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(tx)}">Enviar por WhatsApp</a><button class="share alt" id="cp">Copiar el texto</button><textarea id="tx" readonly style="display:none">${esc(tx)}</textarea>${S.cur<15?`<button class="go" data-j2="${S.cur+1}">Ir a la Jornada ${S.cur+1}</button><p class="small">La siguiente jornada se abre al terminar la anterior.</p>`:`<div class="sum"><b>🎉 ¡Felicitaciones, ${esc(S.name)}!</b><div class="small">Terminaste las 15 jornadas del Módulo 1. Abre tu resumen, imprímelo o guárdalo como PDF, y fírmalo.</div></div><button class="go" data-rep="1">Ver mi resumen / imprimir</button>`}`;save()}}
 if(T.step>0&&!T.fin)h+=`<button class="back" data-go="${T.step-1}">← Atrás</button>`;h+=`</div>`}
m.innerHTML=h;window.scrollTo(0,0);side();bind()}
function bind(){const q=s=>document.querySelectorAll(s);
q("[data-j]").forEach(b=>b.onclick=()=>{S.rep=false;pick(+b.dataset.j);save();render()});q("[data-j2]").forEach(b=>b.onclick=()=>{pick(+b.dataset.j2);save();render()});q("[data-rep]").forEach(b=>b.onclick=()=>{S.rep=b.dataset.rep==="1";save();render()});
const cpr=document.getElementById("cpr");if(cpr)cpr.onclick=()=>{try{navigator.clipboard.writeText(repText());cpr.textContent="¡Copiado!"}catch(e){window.prompt("Copia este texto:",repText())}};const nm=document.getElementById("nm");if(nm)nm.oninput=()=>{S.name=nm.value;save();document.getElementById("st").disabled=S.name.trim().length<2;side()};
const st=document.getElementById("st");if(st)st.onclick=()=>{S.started=true;save();render()};

q("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(T.a[k]!==undefined)return;T.sel[k]=+b.dataset.i;ok(k,+b.dataset.i===+b.dataset.c);render()});
q("[data-np]").forEach(b=>b.onclick=()=>{T.pi++;save();render()});
q("[data-r]").forEach(b=>b.onclick=()=>{T.r[b.dataset.r]=+b.dataset.i;save();render()});
const sb2=document.getElementById("sb2");if(sb2)sb2.onclick=()=>{T.tries++;const all=J.qz.every((qq,i)=>T.r["q"+i]===qq[2]);if(all)T.pass=true;else{T.fail=true;T.r={}}save();render()};
const rt=document.getElementById("rt");if(rt)rt.onclick=()=>{T.fail=false;save();render()};
q("[data-chip]").forEach(b=>b.onclick=()=>{T.chip=b.dataset.chip;if(!T.ref)T.ref=J.rf[2]+" "+T.chip;save();render()});
const rf=document.getElementById("rf");if(rf)rf.oninput=()=>{T.ref=rf.value;save()};
q("[data-d]").forEach(b=>b.onclick=()=>{T.di[b.dataset.d]=b.dataset.v;save();render()});
const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const t=document.getElementById("tx");t.style.display="block";t.select();try{navigator.clipboard.writeText(t.value);cp.textContent="Copiado"}catch(e){cp.textContent="Selecciona y copia el texto"}}}
document.getElementById("tg").onclick=function(){const s=document.getElementById("sb").classList.toggle("show");this.setAttribute("aria-expanded",s)};
